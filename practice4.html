        .images img{

            width: 13%;

            animation: bounce 3s infinite;
        }
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0); 
            }
            50% {

            }
            }
        .images span{

        #cart_add{

        /* dark mode */

body.dark-mode {

}

body.dark-mode .price h3 {

}

    <script>
        let foodbar_img = document.getElementById("foodbar_img");
        let images = document.querySelectorAll(".footer .images img");

        images.forEach(img=>{
            img.addEventListener('click',function(e){
            foodbar_img.src = e.target.currentSrc
            
        })
        })
        let moon = document.getElementById("moon");

        moon.addEventListener('click', function(){
            document.body.classList.toggle("dark-mode");
        });

        let cart_count = document.querySelector(".cart-count");
        let  cart_add = document.querySelectorAll("#cart_add");
        let count = 0;

        cart_add.forEach(item=>{
            item.addEventListener('click',function(){
                cart_count.textContent = count++;
        })
        })
